  /api/v2/vulnerabilities:
    post:
      tags:
      - Security Dashboard Vulnerability
      summary: Get CVE information for devices
      description: 'Retrieves CVE information including CVE ID, CVSS score, EPSS score, and severity for specified devices. The response groups devices by site and company, containing  information and a list of devices with their vulnerabilities. Requires endpointIDs array in the request body.(PartnerID is extracted from bearer token automatically)


        **Authentication:** Send `Authorization: Bearer <access_token>` where the token is obtained from `POST /v1/token`.'
      operationId: getCVEInfoForDevices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CVEInfoRequest'
      responses:
        '200':
          description: Successful response - all requested devices processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CVEInfoResponseSuccess'
              example:
                status: success
                successfulRecords:
                  data:
                  - siteId: string
                    siteName: string
                    clientId: string
                    clientName: string
                    devices:
                    - deviceId: string
                      deviceName: string
                      vulnerabilities:
                      - cve_id: string
                        cvss_score: 0
                        epss_score: 0
                        severity: Critical
                failedRecords:
                  data: []
        '400':
          description: Bad Request - Invalid request parameters or body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No records found - all requested devices failed (no vulnerability data available)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CVEInfoResponseError'
              example:
                status: error
                successfulRecords: {}
                failedRecords:
                  data:
                  - devices:
                    - deviceId: string
                      deviceName: ''
                      error: No vulnerability data is currently available for this selection. This may be due to a pending or failed scan, or no vulnerabilities were detected or you have provided invalid endpoint.
        '422':
          description: Unprocessable Entity - Some devices processed successfully, some failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CVEInfoResponsePartialSuccess'
              example:
                status: partial_success
                successfulRecords:
                  data:
                  - siteId: string
                    siteName: string
                    clientId: string
                    clientName: string
                    devices:
                    - deviceId: string
                      deviceName: string
                      vulnerabilities:
                      - cve_id: string
                        cvss_score: 0
                        epss_score: 0
                        severity: Critical
                failedRecords:
                  data:
                  - devices:
                    - deviceId: string
                      deviceName: string
                      error: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
