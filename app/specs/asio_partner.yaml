  /api/platform/v2/device/companies/{companyID}/sites/{siteID}/endpoints/{endpointID}/metrics/processors/time-series:
    get:
      tags:
      - Devices
      summary: Get processor/CPU time series for an endpoint
      operationId: getDeviceProcessorTimeSeries
      security:
      - token_list:
        - platform.devices.read
      parameters:
      - name: companyID
        in: path
        required: true
        description: Company identifier.
        schema:
          type: string
          format: uuid
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
      - name: siteID
        in: path
        required: true
        description: Site identifier.
        schema:
          type: string
          format: uuid
        example: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
      - name: endpointID
        in: path
        required: true
        description: Endpoint identifier.
        schema:
          type: string
          format: uuid
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      - name: index
        in: query
        required: false
        description: |
          Optional CPU socket / processor index. Omit to return the combined processor metric.
        schema:
          type: integer
          minimum: 0
        example: 0
      - name: from
        in: query
        required: false
        description: |
          Start of the time range (RFC3339). Must be provided together with **`to`**, or both omitted. When both are omitted, defaults to one hour before the current UTC time. Must not be after **`to`**; together with **`to`**, the range must be at most 15 days.
        schema:
          type: string
          format: date-time
        example: '2026-04-22T00:00:00Z'
      - name: to
        in: query
        required: false
        description: |
          End of the time range (RFC3339). Must be provided together with **`from`**, or both omitted. When both are omitted, defaults to the current UTC time. Must not be in the future.
        schema:
          type: string
          format: date-time
        example: '2026-04-22T23:59:59Z'
      - name: filter
        in: query
        required: false
        description: |
          Comma-separated metric field names. Omit for all fields. Allowed values include **totalProcesses**, **cpuUserPercent**, **cpuSystemPercent**, **cpuIdlePercent**, **cpuUtilizationPercent**, **cpuInterruptPercent**, **cpuIOWaitPercent**.
        schema:
          type: string
        example: cpuUtilizationPercent,cpuUserPercent
      - name: bucketCount
        in: query
        required: false
        description: |
          Optional. Omit to return one row per sample. From 1 to 10000, splits the range into that many equal parts and returns one averaged row per part.
        schema:
          type: integer
          minimum: 1
          maximum: 10000
        example: 48
      responses:
        '200':
          description: |
            **OK** — at least one matching data point is returned. **companyID**, **siteID**, and **endpointID** in the body match the path. When aggregation is used, **averageBucketSizeMinutes** describes the typical bucket width; it is omitted for raw per-sample responses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessorTimeSeriesResponse'
              examples:
                aggregated:
                  summary: Aggregated time series with bucket metadata
                  value:
                    companyID: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    siteID: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
                    endpointID: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    name: _Total
                    averageBucketSizeMinutes: 30
                    metrics:
                    - createTimestampUTC: '2026-04-22T12:00:00Z'
                      totalProcesses: 120
                      cpuUserPercent: 28.1
                      cpuSystemPercent: 14.4
                      cpuIdlePercent: 57.5
                      cpuUtilizationPercent: 42.5
                      cpuInterruptPercent: 0.3
                      cpuIOWaitPercent: 0.2
        '400':
          description: |
            **Bad request** — invalid path or query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                partial_time_range:
                  summary: Only one of from/to provided
                  value:
                    code: BAD_REQUEST
                    message: Query parameters 'from' and 'to' must both be provided or both omitted; providing only one is not allowed.
                bad_filter:
                  summary: Unknown filter field
                  value:
                    code: BAD_REQUEST
                    message: Query parameter 'filter' contains an unknown field (use totalProcesses, cpuUserPercent, cpuSystemPercent, cpuIdlePercent, cpuUtilizationPercent, cpuInterruptPercent, cpuIOWaitPercent).
        '401':
          description: '**Unauthorized** — invalid or missing JWT. '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                unauthorized:
                  value:
                    code: UNAUTHORIZED
                    message: Invalid or missing JWT
        '403':
          description: |
            **Forbidden** — JWT is valid but the caller has no access to the requested company/site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                forbidden:
                  value:
                    code: FORBIDDEN
                    message: JWT valid but caller has no access to any of the requested resources
        '404':
          description: |
            **Not found** — no matching processor time-series data for this request (for example, nothing in the requested time range).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                no_data_in_range:
                  summary: No samples in range
                  value:
                    code: NOT_FOUND
                    message: No processor time-series data in the requested time range for this endpoint.
        '429':
          description: |
            **Too many requests** — rate limit exceeded.
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
              example: Too Many Requests
        '500':
          description: |
            **Internal server error** — the service could not complete the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                storage_error:
                  summary: Data store error
                  value:
                    code: INTERNAL_ERROR
                    message: Processor query failed.
      description: |
        Returns **CPU utilization and related processor metrics** over a requested time range for a single endpoint scoped by **company**, **site**, and **endpoint** identifiers.

        Samples whose stored company or site do not match the path are ignored. When **`index`** is provided, only data for that specific CPU socket is returned; otherwise the combined (aggregate) processor metric is returned.

        **Query parameters**
        - **`from`** / **`to`**: optional RFC3339 range. Provide both or omit both; when omitted,
          defaults to the last hour ending at current UTC. Span must be at most **15 days**.

        - **`filter`**: optional comma-separated metric field names; omit for all fields.
        - **`bucketCount`**: optional aggregation (1–10000); omit for one row per sample.

        **Authentication:** Send `Authorization: Bearer <access_token>` where the token is obtained from `POST /v1/token`.

        **Required OAuth2 scope(s):** `platform.devices.read`
