    get:
      tags:
      - Tickets
      summary: Returns selected Notes for Service ticket
      description: 'This API fetches the selected notes for a specific ticket from system and returns it.


        **Authentication:** Send `Authorization: Bearer <access_token>` where the token is obtained from `POST /v1/token`.'
      parameters:
      - name: id
        in: path
        description: the id of the ticket for which notes API is being called
        required: true
        schema:
          type: string
          format: uuid
      - name: detail
        in: query
        description: filter by note detail
        schema:
          type: string
      - name: extendedAttributeIds
        in: query
        description: filter by extendedAttributeIds
        schema:
          type: string
      - name: visibility
        in: query
        description: "a comma separated list of visibility ids to filter by note visibility field Visibility of the note:\n * 1 - Visible to all\n * 2 - Visible to a specific partner\n * 7 - Expert services,visible to partner and expert service users\n * 8 - Expert users,visible to expert users\n"
        schema:
          type: string
          example: Id1,Id2
      - name: createdBy
        in: query
        description: a comma separated list of user ids to filter by note createdBy field
        schema:
          type: string
          example: userId1,userId2
      - name: createdAtFrom
        in: query
        description: 'start date and time to filter by createdAt field

          supports 3 value formats

          1. date only - ''2019-01-31''

          2. date and time ''2019-01-31T15:01:02''

          3. rfc3339 - ''2019-10-12T07:20:50.52+00:00''

          '
        schema:
          type: string
          format: date-time
      - name: createdAtTo
        in: query
        description: 'end date and time to filter by createdAt field

          supports 3 value formats

          1. date only - ''2019-01-31'' - in this case actual end date will be ''2019-01-31T23:59:59''

          2. date and time ''2019-01-31T15:01:02''

          3. rfc3339 - ''2019-10-12T07:20:50.52+00:00''

          '
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Successful response with selected notes for a specific ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketNotes'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketAPIErrors'
        '400':
          $ref: '#/components/responses/responseGenericError400'
