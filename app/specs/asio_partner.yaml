  /api/v1/cases/{caseId}/update-status:
    post:
      tags:
      - Security Dashboard Cases
      summary: Update case status
      description: |
        Updates case status for caseId in the authenticated partner scope.
        Request body supplies the target status (lowercase canonical values). Transition rules depend on company_type on GET /api/v1/cases (managed or unmanaged).

        Managed companies: status updates via this partner API are not supported. Every request returns HTTP 400 with message
        `status updates are not supported for managed cases via partner API`.

        Unmanaged companies — allowed transitions:
        | Current status | Allowed target statuses |
        | open | investigating, in_progress, closed_resolved, closed_false_positive |
        | investigating | in_progress, closed_resolved, closed_false_positive |
        | in_progress | investigating, closed_resolved, closed_false_positive |
        | closed_resolved | open only (re-open) |
        | closed_false_positive | open only (re-open) |

        From a closed status, move to open before any other status. Target escalated is not valid for unmanaged tier (HTTP 403).
        Requesting the same status as the current status returns HTTP 409 (unmanaged only).

        Response returns lowercase status (for example in_progress).

        Audit: Successful and failed requests are audited by the service; partners can view them on the
        Audit Trails page in ConnectWise Platform.
      operationId: updateCaseStatus
      security:
      - endpoints_list: [security.cases.write]
      parameters:
      - $ref: '#/components/parameters/caseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCaseStatusRequest'
            examples:
              inProgress:
                summary: Unmanaged — open to in progress
                value:
                  status: in_progress
              reopen:
                summary: Unmanaged — closed resolved to open
                value:
                  status: open
              closeResolved:
                summary: Unmanaged — investigating to closed resolved
                value:
                  status: closed_resolved
      responses:
        "200":
          description: Case status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCaseStatusResponse'
              examples:
                success:
                  summary: Status updated
                  value:
                    case_id: 42
                    status: in_progress
        "400":
          description: >-
            Invalid request or disallowed status transition. Managed companies always receive 400 for status updates.
            Unmanaged companies receive 400 for invalid transitions (for example closed to investigating without re-opening to open first).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                managedNotAllowed:
                  summary: Managed company — any status change
                  value:
                    code: error:bad-request
                    message: status updates are not supported for managed cases via partner API
                illegalTransition:
                  summary: Unmanaged — invalid transition
                  value:
                    code: error:bad-request
                    message: closed cases must transition to open before other statuses
        "401":
          description: Unauthorized - Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: >-
            Forbidden — insufficient permissions, or target status not allowed for the case company tier (for example escalated on unmanaged).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbiddenTier:
                  value:
                    code: ERR403
                    message: status not allowed for partner tier
        "404":
          description: Case not found or not in partner scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Unmanaged case already has the requested status (managed companies receive 400 instead of 409)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                sameStatus:
                  value:
                    code: RecordAlreadyExists
                    message: case already has the requested status
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

