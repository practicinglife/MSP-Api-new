        format: uuid
    offlineLookback:
      name: offlineLookback
      in: query
      required: false
      description: 'Return only the endpoints offline for >= N days. Format: `Nd` (e.g. `7d`). `N` must be a non-negative integer.'
      schema:
        type: string
        example: 7d
    availability:
      name: availability
      in: query
      required: false
      description: Filter by availability status. `true` = online, `false` = offline. Cannot be combined with **offlineLookback**.
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
    packageID:
      name: packageID
      in: path
      description: Package ID
      required: true
      schema:
        type: string
        format: uuid
    groupID:
      name: groupID
      in: path
      description: Policy Group ID
      required: true
      schema:
        type: string
        format: uuid
    tpLimit:
      name: limit
      in: query
      description: Max endpoints per page (default 500, max 500)
      schema:
        type: integer
        default: 500
        maximum: 500
    tpCursor:
      name: cursor
      in: query
      description: Pagination cursor (default 0)
      schema:
        type: integer
        minimum: 0
        default: 0
    tpComplianceField:
      name: field
      in: query
      description: 'Optional comma-separated projection tokens. Omit or leave empty to return **all** projectable metrics below. Any other token returns **400**.


        **Projectable** (valid `field` tokens): **assessedAt** · **complianceScore** · **updatesPending**

        '
      schema:
        type: string
      example: complianceScore,updatesPending
    tpPatchDetailsField:
      name: field
      in: query
      description: 'Optional comma-separated projection tokens. Omit or leave empty to return **all** projectable application fields below. Any other token returns **400**.


        **Projectable** (valid `field` tokens): **applicationID** · **applicationName** · **publisher** · **latestVersion** · **installedVersion** · **status** · **policyMatch** · **userName** · **partnerApprovalStatus**

        '
      schema:
        type: string
      example: applicationID,status,latestVersion
    caseId:
      name: caseId
      in: path
      description: Case identifier in the authenticated partner scope
      required: true
      schema:
        type: string
      example: "42"
    alertId:
      name: alertId
      in: path
      description: Alert identifier in the authenticated partner scope
      required: true
      schema:
        type: string
      example: "501"
    company_ids:
      name: company_ids
      in: query
      description: Comma-separated platform company UUIDs used to filter results
      required: false
      schema:
        type: string
      example: "11111111-1111-1111-1111-111111111111,aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
    site_ids:
      name: site_ids
      in: query
      description: Comma-separated platform site UUIDs used to filter results
      required: false
      schema:
        type: string
      example: "22222222-2222-2222-2222-222222222222"
    search:
      name: search
      in: query
      description: Case-insensitive match on title, category, severity, status, company name, or site name
      required: false
      schema:
        type: string
    search_case_alerts:
      name: search
      in: query
      description: Substring match on alert title
      required: false
      schema:
        type: string
    sort_cases:
      name: sort
      in: query
      description: Sort field. Default updated_at.
      required: false
      schema:
        type: string
        enum: [created_at, updated_at, severity, status, title, category, alerts_count, company_type]
        default: updated_at
    sort_case_alerts:
      name: sort
      in: query
      description: Sort field. Default created_at.
      required: false
      schema:
        type: string
        enum: [created_at, updated_at, severity, status, title, category]
        default: created_at
    order:
      name: order
      in: query
      description: Sort direction. Default desc.
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    next_cursor:
      name: next_cursor
      in: query
      description: Opaque cursor for the next page. Do not send with prev_cursor.
      required: false
      schema:
        type: string
    prev_cursor:
      name: prev_cursor
      in: query
      description: Opaque cursor for the previous page. Do not send with next_cursor.
      required: false
      schema:
        type: string
    limit_positive:
      name: limit
      in: query
      description: Page size. Default 20 when omitted. Must be at least 1 when provided.
      required: false
      schema:
        type: integer
        minimum: 1
        default: 20
    limit_cases:
      name: limit
      in: query
      description: |
        Page size for cursor-paginated list endpoints. Defaults to 20 when omitted.
        When provided it must be a positive integer. Per-endpoint maximums are documented on each operation.
      required: false
      schema:
        type: integer
        minimum: 1
        default: 20
  requestBodies:
    OperationArray:
      content:
        application/json:
          schema:
            items:
              $ref: '#/components/schemas/Operation'
            type: array
    PartnerAttributeDefinitionPOST:
      description: Schema for creating a new partner attribute definition.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PartnerAttributeDefinitionCreate'
          example:
            entityType: client
            name: string
            description: string
            attributeType: enum
            validationOptions:
              regex: string
              enum:
              - string
              enumSubType: string
              uiType: string
              inactive:
              - string
            defaultValue: string
            isEditable: true
            helpText: string
            localizedHelpText: string
            defaultPodMetadata:
              value: string
            isHidden: true
            isRequired: true
    PartnerAttributeDefinitionPUT:
      description: Schema for updating a partner attribute definition.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PartnerAttributeDefinitionCreate'
          example:
            entityType: client
            name: string
            description: string
            attributeType: enum
            validationOptions:
              regex: string
              enum:
              - string
              enumSubType: string
              uiType: string
              inactive:
              - string
            defaultValue: string
            isEditable: true
            helpText: string
            localizedHelpText: string
            defaultPodMetadata:
              value: string
            isHidden: true
            isRequired: true
    PartnerAttributeValuesPUT:
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                entityId:
                  type: string
                  description: "Should be of uuid format for endpoint, site, client entity types. \nIn case product context is specified in header for site entity, then it should be an integer in string format\n"
                attributeId:
                  type: string
                  format: uuid
                value:
                  type: string
            example:
            - entityId: a9095743-e131-49f1-8a24-34508d07abf3
              attributeId: 9e98f3e0-a609-4258-be46-fa6a0ba963da
              value: test_value
            - entityId: a9095743-e131-49f1-8a24-34508d07abf3
              attributeId: 9e98f3e0-a609-4258-be46-fa6a0ba963da
              value: test_value
      required: true
      description: Schema for updating partner attribute values
  headers:
    PaginationLink:
      description: '**Pagination Link Header**

        It is automatically included when there are more results available than can be returned in a single response. The Link header includes a URL that can be used to retrieve the next set of results.

        '
      schema:
        type: string
        example: <..../endpoints?cursor=500&limit=500>; rel="next"
  responses:
    responseCompanyUpdated200:
      description: Updated company
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Company'
    responseGenericError400:
      description: Incorrect incoming request data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/responseGeneric'
    responseGenericError401:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/responseGeneric'
    responseGenericError404:
      description: Nothing found by incoming request data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/responseGeneric'
    responseGenericError500:
      description: Internal server error while request handling
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/responseGeneric'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    OAuth2:
      type: oauth2
      description: OAuth 2.0 authentication with client credentials flow.
      flows:
        clientCredentials:
          tokenUrl: /v1/token
          scopes:
            platform.devices.read: Read access to devices
            platform.devices.write: Write access to devices
            platform.ospatching.management.read: Read OS patch compliance, bulk patch details, and patch inventory
            platform.tppatching.management.read: Read third-party patch compliance summary and patch details
            platform.policies.read: Read access to policies
            platform.backup.read: Read Cloud Backup subscriptions, resources, policies, and alerts
            platform.backup.create: Create or update Cloud Backup resources
            platform.backup.delete: Cancel, suspend, or revoke Cloud Backup access
            platform.deviceGroups.read: Read access to device groups
            backupdashboard.jobs.read: Read backup job records
            backupdashboard.dr-readiness.read: Read DR readiness records
            backupdashboard.alarms.read: Read alarm records
    token_list:
      type: oauth2
      description: OAuth 2.0 authentication with client credentials flow.
      flows:
        clientCredentials:
          tokenUrl: /v1/token
          scopes:
            platform.devices.read: Read access to devices
            platform.deviceGroups.read: Read access to device groups
    endpoints_list:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://openapi.int.use1.cwcmddev.cwnet.io/v1/token
          scopes:
            security.cases.read: Read access to security cases
            security.cases.write: Write access to security cases
