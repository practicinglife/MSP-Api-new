      operationId: getEffectivePolicyMappingForEndpoint
      description: 'Returns only the resolution source per setting: which policy won, at which container level, and optionally which package or policy group contributed. Each item in `mapping` identifies a domain and setting plus its winning source (`policy`, `container`, and optionally `package` or `policyGroup`). Policies with type `Default` use the display name `Default` when no custom name is stored; type `Override` uses `Override` the same way. `package` and `policyGroup` appear only when applicable. `createdAt` / `updatedAt` reflect the stored effective-policy record timestamps (RFC 3339 date-time) and may be omitted when not set.


        **Authentication:** Send `Authorization: Bearer <access_token>` where the token is obtained from `POST /v1/token`.


