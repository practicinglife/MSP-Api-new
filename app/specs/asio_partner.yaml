      description: "\nFetches all categorized endpoints data grouped by company and site for the given user.\n<br><br>\n<b>Note:</b>\n  - The response is paginated with a maximum of 500 endpoints per page. The Link header provides the URL for the next page, if available.\n  - The API has projection support to retrieve only selected fields. Maximum of **15 fields**.\n  - If no projection fields are specified, only the **minimal fields** (metadata) will be returned by default. Please refer to the **projection guidelines** in the documentation center for more details.</li>\n\n**Authentication:** Send `Authorization: Bearer <access_token>` where the token is obtained from `POST /v1/token`.\n\n**Required OAuth2 scope(s):** `platform.devices.read`"
