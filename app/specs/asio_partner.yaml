          type: number
          format: double
          description: |
            Average bucket width in minutes. Omitted for raw per-sample responses.
          example: 30
        metrics:
          type: array
          description: Time-ordered processor metric samples.
          items:
            $ref: '#/components/schemas/ProcessorTimeSeriesMetricPoint'
    ProcessorTimeSeriesMetricPoint:
      type: object
      description: One processor metric sample or aggregated bucket row.
      required:
      - createTimestampUTC
      properties:
        createTimestampUTC:
          type: string
          format: date-time
          description: |
            UTC time for this bucket; mean sample time when samples exist, otherwise the midpoint of the bucket window. When no samples fall in an aggregated bucket, processor metric fields may be omitted.
          example: '2026-04-22T12:00:00Z'
        totalProcesses:
          type: integer
          format: int64
          description: Total number of running processes at sample time. Omitted when excluded by **`filter`**.
          example: 120
        cpuUserPercent:
          type: number
          format: double
          description: Percentage of time CPU spent in user mode. Omitted when excluded by **`filter`**.
          example: 28.1
        cpuSystemPercent:
          type: number
          format: double
          description: Percentage of time CPU spent in privileged/system mode. Omitted when excluded by **`filter`**.
          example: 14.4
        cpuIdlePercent:
          type: number
          format: double
          description: Percentage of time CPU was idle. Omitted when excluded by **`filter`**.
          example: 57.5
        cpuUtilizationPercent:
          type: number
          format: double
          description: Overall CPU utilisation percentage (0–100). Omitted when excluded by **`filter`**.
          example: 42.5
        cpuInterruptPercent:
          type: number
          format: double
          description: Percentage of time CPU spent handling hardware interrupts. Omitted when excluded by **`filter`**.
          example: 0.3
        cpuIOWaitPercent:
          type: number
          format: double
          description: Percentage of time CPU waited on I/O. Omitted when excluded by **`filter`**.
          example: 0.2
    MemoryTimeSeriesResponse:
      type: object
      description: |
        Published success body for memory time-series (`memoryTimeSeriesCompanyResponse` in platform definitions).
      required:
      - companyID
      - siteID
      - endpointID
      - metrics
      properties:
        companyID:
          type: string
          format: uuid
          description: Company identifier from the request path.
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        siteID:
          type: string
          format: uuid
          description: Site identifier from the request path.
          example: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
        endpointID:
          type: string
          format: uuid
          description: Endpoint identifier from the request path.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        averageBucketSizeMinutes:
          type: number
          format: double
          description: |
            Average bucket width in minutes. Omitted for raw per-sample responses.
          example: 30
        metrics:
          type: array
          description: Time-series points for matching company, site, and endpoint.
          items:
            $ref: '#/components/schemas/MemoryTimeSeriesMetricPoint'
    MemoryTimeSeriesMetricPoint:
      type: object
      description: One memory metric sample or aggregated bucket row.
      required:
      - createTimestampUTC
      properties:
        createTimestampUTC:
          type: string
          format: date-time
          description: |
            UTC time for this bucket (RFC3339); mean sample time when samples exist, otherwise the midpoint of the bucket window. When no samples fall in an aggregated bucket, memory metric fields may be omitted.
          example: '2026-05-13T06:01:33.831Z'
        totalPhysicalMemoryBytes:
          type: integer
          format: int64
          description: Total physical RAM installed in bytes. Omitted when excluded by **`filter`**.
          example: 16794279936
        usedPhysicalMemoryBytes:
          type: integer
          format: int64
          description: Physical RAM currently in use in bytes. Omitted when excluded by **`filter`**.
          example: 15032209408
        availablePhysicalMemoryBytes:
          type: integer
          format: int64
          description: Physical RAM available for use in bytes. Omitted when excluded by **`filter`**.
          example: 1762070528
        totalVirtualMemoryBytes:
          type: integer
          format: int64
          description: Total virtual memory in bytes. Omitted when excluded by **`filter`**.
        usedVirtualMemoryBytes:
          type: integer
          format: int64
          description: Virtual memory currently in use in bytes. Omitted when excluded by **`filter`**.
        availableVirtualMemoryBytes:
          type: integer
          format: int64
          description: Virtual memory available in bytes. Omitted when excluded by **`filter`**.
        committedMemoryPercent:
          type: number
          format: double
          description: Percentage of committed memory in use. Omitted when excluded by **`filter`**.
        committedMemoryBytes:
          type: integer
          format: int64
          description: Committed memory in bytes. Omitted when excluded by **`filter`**.
        freePageTableBytes:
          type: integer
          format: int64
          description: Free system page table entries in bytes. Omitted when excluded by **`filter`**.
        nonPagedPoolBytes:
          type: integer
          format: int64
          description: Non-paged pool memory in bytes. Omitted when excluded by **`filter`**.
        swapInBytesPerSecond:
          type: integer
          format: int64
          description: Bytes per second swapped in from disk. Omitted when excluded by **`filter`**.
        swapOutBytesPerSecond:
          type: integer
          format: int64
          description: Bytes per second swapped out to disk. Omitted when excluded by **`filter`**.
        bufferMemoryBytes:
          type: integer
          format: int64
          description: Memory used for buffers in bytes. Omitted when excluded by **`filter`**.
        cachedMemoryBytes:
          type: integer
          format: int64
          description: Memory used for file system cache in bytes. Omitted when excluded by **`filter`**.
        sharedMemoryBytes:
          type: integer
          format: int64
          description: Shared memory in use in bytes. Omitted when excluded by **`filter`**.
        pagesBytesPerSecond:
          type: integer
          format: int64
          description: Memory pages read/written per second in bytes. Omitted when excluded by **`filter`**.
        pagesOutputPerSecond:
          type: integer
          format: int64
          description: Memory pages written to disk per second. Omitted when excluded by **`filter`**.
