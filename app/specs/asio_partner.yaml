openapi: 3.0.3
info:
  title: ConnectWise Platform APIs
  description: 'ConnectWise Platform APIs for partner integrations.


    ## Authentication


    1. Obtain an access token by calling `POST /v1/token` with your `client_id` and `client_secret` (client credentials grant).

    2. Pass the returned token on every API request: `Authorization: Bearer <access_token>`.


    Each endpoint may require specific OAuth2 scopes on the token. Scope requirements are listed in the endpoint description.


    > **Warning:** The Developer Portal "Try it" button does not supply a Bearer token. Use curl, Postman, or your automation client with a token from `POST /v1/token`.'
  version: 3.0.4
servers:
- url: https://openapi.service.itsupport247.net
- url: https://openapi.service.euplatform.connectwise.com
- url: https://openapi.service.auplatform.connectwise.com
tags:
- name: Authorization
  description: OAuth2 client credentials and token issuance.
- name: Automation
  description: Task scheduling, execution, and automation workflows.
- name: Rate Limits
  description: API rate limit status and quotas.
- name: Devices
  description: Endpoint and device inventory, monitoring, and management.
- name: Tickets
  description: Service ticketing types, assignments, and related metadata.
- name: Custom Fields Values
  description: Custom field values on platform entities.
- name: Custom Fields Definitions
  description: Custom field definition management.
- name: OS Patching
  description: Operating system patch compliance and inventory.
- name: Third Party Patching
  description: Third-party application patch compliance and inventory.
- name: Suspensions
  description: Endpoint suspension state management.
- name: Device Groups
  description: Device group membership and configuration.
- name: Cloud Backup - Subscription management
  description: Create, list, place, suspend, activate, and cancel Cloud Backup subscriptions.
- name: Cloud Backup - Policies
  description: Retention and storage settings for Cloud Backup subscriptions.
- name: Cloud Backup - Resources
  description: Exchange mailbox inventory for a Cloud Backup subscription.
- name: Cloud Backup - Customer access
  description: Grant and revoke customer access to a Cloud Backup subscription.
- name: Cloud Backup - Alerts
  description: View and complete Cloud Backup alerts.
- name: Security Dashboard Cases
  description: Threat-enrichment security cases, alerts, indicators of compromise, impacted entities, MITRE mappings, timelines, and comments.
- name: Backup Dashboard
  description: Backup job, DR readiness verification, and alarm records for a company.
paths:
  /api/platform/v2/device/endpoints/search:
    get:
      tags:
      - Devices
      summary: Search endpoints by query
      description: |-
        Searches endpoints across categories using endpoint attributes.
        <br><br>
        <b>Note:</b>
          - The response is paginated with a maximum of 500 endpoints per page. The Link header provides the URL for the next page, if available.
          - Results are grouped by endpoint category, then by company and site.
          - Only categories that contain matching endpoints are included in the response.

        **Allowed `conditions` fields:**

        | Field | Operators | Notes |
        |---|---|---|
        | `osType` | `=`, `contains` | `contains` value must be 3–128 characters |
        | `endpointType` | `=` | must be a valid endpoint type |
        | `deviceName` | `=`, `contains` | `contains` value must be 3–128 characters |
        | `friendlyName` | `=`, `contains` | `contains` value must be 3–128 characters |
      operationId: Search endpoints by conditions
      security:
      - endpoints_list: [platform.devices.read]

      parameters:
      - $ref: "#/components/parameters/headerAuthorization"
      - $ref: "#/components/parameters/headerHost"
      - $ref: "#/components/parameters/headerOrigin"
      - $ref: "#/components/parameters/headerUserAgent"
      - $ref: "#/components/parameters/headerXRequestID"
      - $ref: "#/components/parameters/conditions"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/cursor"

      responses:
        "200":
          description: Successful response containing endpoints matching the filter.
          headers:
            Link:
              $ref: "#/components/headers/PaginationLink"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/searchEndpointsResponse"
        "400":
          description: |
            Bad request. Returned when the `conditions` expression is malformed, an unsupported
            field or operator is used, the `contains` operator is applied to an unsupported
            field, or a query value is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"

