  /api/backup-dashboard/companies/{companyID}/instances:
    get:
      tags:
        - Backup Dashboard
      summary: Returns backup job records for a company
      operationId: getPublicBackupJobs
      description: |-
        Returns a paginated list of backup job records for the specified company.
        When started_after and started_before are omitted, the API returns current backup job records.
        When a date window is provided, started_after is inclusive and started_before is exclusive
        (records with start_timestamp >= started_after and < started_before are returned). The window
        may span at most one UTC day; to query an entire day, set started_after to that day's 00:00:00
        UTC and started_before to the next day's 00:00:00 UTC. Supports Tier-1 product filtering and
        Tier-2 filters for job status and job type.

        Pagination: query parameters `limit` (default 500, max 500) and `cursor` (default 0). When more
        pages exist, the response includes a `Link` header (RFC 8288) with `rel="next"`. Use the URL
        from the Link header to retrieve the next page; do not construct cursors manually.

        **Authentication:** Send Authorization: Bearer <access_token> where the token is obtained from POST /v1/token.

        **Required OAuth2 scope(s):** backupdashboard.jobs.read
      security:
        - OAuth2:
            - backupdashboard.jobs.read
      parameters:
        - $ref: "#/components/parameters/companyID"
        - name: started_after
          in: query
          required: false
          description: Inclusive lower bound of the date window in unix milliseconds. Required
            when started_before is provided.
          schema:
            type: integer
            format: int64
          example: 1692955384000
        - name: started_before
          in: query
          required: false
          description: Exclusive upper bound of the date window in unix milliseconds. Required
            when started_after is provided.
          schema:
            type: integer
            format: int64
          example: 1694165384000
        - name: product
          in: query
          required: false
          description: |-
            Filter by one or more backup product display names (comma-separated, exact match).
            Resolved to product IDs via extensibility before querying Cassandra.
            Allowed values: ConnectWise SaaS Backup, Acronis Cyber Protect, ConnectWise Cloud Backup,
            Axcient x360Recover, Datto BCDR, Veeam Service Provider Console, Axcient x360Cloud.
          schema:
            type: string
          example: "Axcient x360Recover,Datto BCDR"
        - name: jobStatus
          in: query
          required: false
          description: |-
            Filter by one or more normalised backup status values (comma-separated, exact match).
            Maps to the dashboardBackupStatus field in responses. Valid values: Success, Failure,
            Unknown, Warning, Missed, Running, Paused.
          schema:
            type: string
          example: "Success,Failure"
        - name: jobType
          in: query
          required: false
          description: |-
            Filter records whose job type matches any of the provided values (comma-separated,
            exact match). Common values by product include AgentBackupJob, AgentPolicy, Backup,
            BackupCopy, BackupToTape, BackupVm, Cloud Backup, Full, Local Backup, Offsite Replication,
            ReplicationVM, SimpleBackupCopy, backup, and backup replication (see
            [Filter Key//Values for Backup Dashboard APIs](https://developer.connectwise.com/Products/ConnectWise_Platform/Platform_Partners/Developer_Guides/Filter_Key%2F%2FValues_for_Backup_Dashboard_APIs)
            for the full product-to-job-type mapping).
          schema:
            type: string
          example: "Full,Backup"
        - name: limit
          in: query
          required: false
          description: Maximum number of records per page for Backup Dashboard APIs. Default 500, maximum 500.
          schema:
            type: integer
            default: 500
            maximum: 500
        - name: cursor
          in: query
          required: false
          description: Offset cursor for the next page. Use the URL from the Link response header; do not construct manually.
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: OK
          headers:
            Link:
              description: Pagination Link Header. Automatically included when more results are available. The Link header includes a URL that can be used to retrieve the next set of results.
              schema:
                type: string
              example: <.../api/backup-dashboard/companies/{companyID}/instances?cursor=500&limit=500>; rel="next"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/publicBackupJobsResponse"
              example:
                jobs:
                  - companyId: "823d1d2e-b525-433c-b0dc-165fd351219a"
                    companyName: "Company02_01"
                    siteId: "137dca71-59cd-4d77-baf8-4e14e182858f"
                    siteName: "Sites01_01"
                    productName: "Axcient x360Recover"
                    vendorDeviceId: "VendorDeviceID26502426"
                    instanceId: "instance_id502426"
                    backupJobId: "11674598680SNNY2426"
                    backupJobName: "Test_Backup_Name502436"
                    jobType: "Full"
                    managedBy: "VBR"
                    applianceName: "TestApplianceName"
                    applianceId: "67896589"
                    endpointId: "0efc9e22-67e3-415b-b9a4-26b3b71c3667"
                    vendorDeviceName: "FAKE-WIN_756784608"
                    vendorDeviceType: "Desktop"
                    dashboardBackupStatus: "Failure"
                    summary: "This is Summary"
                    vendorBackupStatus: "OK"
                    totalBackupSize: 40960
                    protectedSize: 2048000000
                    backupLocation: "C:BackupSpace"
                    lastBackupTimestamp: 1234568
                    nextBackupTimestamp: 1234567890
                    startTimestamp: 1787265681078
                    endTimestamp: 1787265681078
                    agentVersion: "3.6.8"
                    recoveryPointId: "456"
                    createdAt: "2026-08-20T22:41:21.112Z"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/publicError"
              example:
                code: "backupdashboard:error:bad-request"
                message: "invalid limit"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/publicError"
              example:
                code: "backupdashboard:error:unexpected"
                message: "unable to extract claims"
        "429":
          description: Too many requests
          content:
            text/plain; charset=utf-8:
              example: Too Many Requests
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/publicError"
              example:
                code: "backupdashboard:error:internal"
                message: "unable to execute api"

  /api/backup-dashboard/companies/{companyID}/dr-readiness:
    get:
      tags:
        - Backup Dashboard
      summary: Returns DR readiness records for a company
      operationId: getPublicDRReadiness
      description: |-
        Returns a paginated list of DR readiness verification records for the specified company.
        When started_after and started_before are omitted, the API returns current DR readiness
        records. When a date window is provided, started_after is inclusive and started_before is
        exclusive (records with start_timestamp >= started_after and < started_before are returned).
        The window may span at most one UTC day; started_after must not be older than 2 months.
        Supports Tier-1 product filtering and Tier-2 filters for DR readiness status and summary name.

        Pagination: query parameters `limit` (default 500, max 500) and `cursor` (default 0). When
        more pages exist, the response includes a `Link` header (RFC 8288) with `rel="next"`. Use
        the URL from the Link header to retrieve the next page; do not construct cursors manually.

        **Authentication:** Send Authorization: Bearer <access_token> where the token is obtained from POST /v1/token.

        **Required OAuth2 scope(s):** backupdashboard.dr-readiness.read
      security:
        - OAuth2:
            - backupdashboard.dr-readiness.read
      parameters:
        - $ref: "#/components/parameters/companyID"
        - name: started_after
          in: query
          required: false
          description: Start of the date window in unix milliseconds, applied to the DR
            readiness start date. Required when started_before is provided.
          schema:
            type: integer
            format: int64
          example: 1692955384000
        - name: started_before
          in: query
          required: false
          description: End of the date window in unix milliseconds, applied to the DR
            readiness start date. Required when started_after is provided.
          schema:
            type: integer
            format: int64
          example: 1694165384000
        - name: product
          in: query
          required: false
          description: |-
            Filter by one or more backup product display names (comma-separated, exact match, max 10).
            Resolved to product IDs via extensibility before querying Cassandra.
            Allowed values: ConnectWise SaaS Backup, Acronis Cyber Protect, ConnectWise Cloud Backup,
            Axcient x360Recover, Datto BCDR, Veeam Service Provider Console, Axcient x360Cloud.
          schema:
            type: string
          example: "Axcient x360Recover"
        - name: drReadinessStatus
          in: query
          required: false
          description: |-
            Filter by one or more DR readiness status values (comma-separated, exact match, max 10).
            Valid values: Success, Failure, Warning, Missed, Unknown.
          schema:
            type: string
          example: "Success,Failure"
        - name: drSummaryName
          in: query
          required: false
          description: Filter by DR readiness summary (comma-separated, exact match, max 10).
          schema:
            type: string
          example: "DR verification completed successfully"
        - name: limit
          in: query
          required: false
          description: Maximum number of records per page for Backup Dashboard APIs. Default 500, maximum 500.
          schema:
            type: integer
            default: 500
            maximum: 500
        - name: cursor
          in: query
          required: false
          description: Offset cursor for the next page. Use the URL from the Link response header; do not construct manually.
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: OK
          headers:
            Link:
              description: Pagination Link Header. Automatically included when more results are available. The Link header includes a URL that can be used to retrieve the next set of results.
              schema:
                type: string
              example: <.../api/backup-dashboard/companies/{companyID}/dr-readiness?cursor=500&limit=500>; rel="next"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/publicDRReadinessResponse"
              example:
                dr:
                  - companyId: "823d1d2e-b525-433c-b0dc-165fd351219a"
                    companyName: "Company02_01"
                    siteId: "137dca71-59cd-4d77-baf8-4e14e182858f"
                    siteName: "Sites01_01"
                    productName: "Axcient x360Recover"
                    vendorDeviceId: "VendorDeviceID26502426"
                    backupInstanceId: "instance_id502426"
                    backupJobId: "11674598680SNNY2426"
                    backupName: "Test_Backup_Name502436"
                    createdAt: "2026-08-20T22:41:21.112Z"
                    endTimestamp: 1787265681078
                    endpointId: "0efc9e22-67e3-415b-b9a4-26b3b71c3667"
                    id: "dr_run_502426"
                    instanceId: "instance_id502426"
                    recoveryPointId: "456"
                    startTimestamp: 1787265681078
                    status: "Success"
                    summary: "DR verification completed successfully"
                    triggeredBy: "Automated"
                    verificationImages:
                      - "https://storage.example.com/dr-screenshot-502426.png"
                    vendorDeviceName: "FAKE-WIN_756784608"
                    vendorDeviceType: "Desktop"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/publicError"
              example:
                code: "backupdashboard:error:bad-request"
                message: 'invalid value "Invalid" for drReadinessStatus'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/publicError"
              example:
                code: "backupdashboard:error:unexpected"
                message: "unable to extract claims"
        "429":
          description: Too many requests
          content:
            text/plain; charset=utf-8:
              example: Too Many Requests
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/publicError"
              example:
                code: "backupdashboard:error:internal"
                message: "unable to execute api"

  /api/backup-dashboard/companies/{companyID}/alarms:
    get:
      tags:
        - Backup Dashboard
      summary: Returns alarm records for a company
      operationId: getPublicAlarms
      description: |-
        Returns a paginated list of alarm records for the specified company, covering both
        site-level and company-level alarms. Optional alarm timestamp bounds may be provided:
        alarm_timestamp_after and/or alarm_timestamp_before, either alone (one-sided filter) or
        both together as a range. Supports Tier-1 product filtering and Tier-2 filters for
        severity, alarm name, family, and status.

        Pagination: query parameters `limit` (default 500, max 500) and `cursor` (default 0).
        When more pages exist, the response includes a `Link` header (RFC 8288) with
        `rel="next"`. Use the URL from the Link header to retrieve the next page; do not
        construct cursors manually.

        For the full vendor-specific list of `name` and `family` filter values, see
        [Filter Key//Values for Backup Dashboard APIs](https://developer.connectwise.com/Products/ConnectWise_Platform/Platform_Partners/Developer_Guides/Filter_Key%2F%2FValues_for_Backup_Dashboard_APIs).

        **Authentication:** Send Authorization: Bearer <access_token> where the token is obtained from POST /v1/token.

        **Required OAuth2 scope(s):** backupdashboard.alarms.read
      externalDocs:
        description: Filter Key//Values for Backup Dashboard APIs
        url: https://developer.connectwise.com/Products/ConnectWise_Platform/Platform_Partners/Developer_Guides/Filter_Key%2F%2FValues_for_Backup_Dashboard_APIs
      security:
        - OAuth2:
            - backupdashboard.alarms.read
      parameters:
        - $ref: "#/components/parameters/companyID"
        - name: alarm_timestamp_after
          in: query
          required: false
          description: Optional inclusive lower bound on alarm_timestamp in unix milliseconds.
            May be provided alone or with alarm_timestamp_before.
          schema:
            type: integer
            format: int64
          example: 1692955384000
        - name: alarm_timestamp_before
          in: query
          required: false
          description: Optional inclusive upper bound on alarm_timestamp in unix milliseconds.
            May be provided alone or with alarm_timestamp_after.
          schema:
            type: integer
            format: int64
          example: 1694165384000
        - name: product
          in: query
          required: false
          description: |-
            Filter by one or more backup product display names (comma-separated, exact match).
            Resolved to product IDs via extensibility before querying Cassandra.
            Allowed values: ConnectWise SaaS Backup, Acronis Cyber Protect, ConnectWise Cloud Backup,
            Axcient x360Recover, Datto BCDR, Veeam Service Provider Console, Axcient x360Cloud.
          schema:
            type: string
          example: "Axcient x360Recover"
        - name: severity
          in: query
          required: false
          description: |-
            Filter by severity (exact match, comma-separated, case-sensitive).
            Valid values: Critical, High, Medium, Low, Informational.
            Note: use Informational in API requests (stored internally as Info; sending Info returns 400).
          schema:
            type: string
          example: "Critical,High"
        - name: name
          in: query
          required: false
          description: |-
            Filter by alarm name (case-sensitive substring match, comma-separated). Vendor-supplied
            free text — not a governed enum. Example values for Axcient x360Recover include BACKUP,
            AUTOVERIFY_BASIC, and OFFSITE_STATUS. See
            [Filter Key//Values for Backup Dashboard APIs](https://developer.connectwise.com/Products/ConnectWise_Platform/Platform_Partners/Developer_Guides/Filter_Key%2F%2FValues_for_Backup_Dashboard_APIs)
            for the full vendor-specific name list.
          schema:
            type: string
          example: "BACKUP"
        - name: family
          in: query
          required: false
          description: |-
            Filter by alarm family (case-sensitive substring match, comma-separated). Vendor-supplied
            free text — not a governed enum. Example values include Backup, Autoverify, Health Status,
            and Backup agent job state. See
            [Filter Key//Values for Backup Dashboard APIs](https://developer.connectwise.com/Products/ConnectWise_Platform/Platform_Partners/Developer_Guides/Filter_Key%2F%2FValues_for_Backup_Dashboard_APIs)
            for the full vendor-specific family list.
          schema:
            type: string
          example: "Backup"
        - name: alarmStatus
          in: query
          required: false
          description: |-
            Filter by alarm status (exact match, comma-separated, case-sensitive).
            Valid values: Open, Closed, Suspended. Use the special value `all` (case-insensitive)
            to return all statuses. Defaults to Open when omitted.
          schema:
            type: string
          example: "Open,Suspended"
        - name: limit
          in: query
          required: false
          description: Maximum number of records per page for Backup Dashboard APIs. Default 500, maximum 500.
          schema:
            type: integer
            default: 500
            maximum: 500
        - name: cursor
          in: query
          required: false
          description: Offset cursor for the next page. Use the URL from the Link response header; do not construct manually.
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: OK
          headers:
            Link:
              description: Pagination Link Header. Automatically included when more results are available. The Link header includes a URL that can be used to retrieve the next set of results.
              schema:
                type: string
              example: <.../api/backup-dashboard/companies/{companyID}/alarms?cursor=500&limit=500>; rel="next"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/publicAlarmsResponse"
              example:
                alarms:
                  - companyId: "823d1d2e-b525-433c-b0dc-165fd351219a"
                    companyName: "Company02_01"
                    siteId: "137dca71-59cd-4d77-baf8-4e14e182858f"
                    siteName: "Sites01_01"
                    status: "Open"
                    productName: "Axcient x360Recover"
                    vendorDeviceId: "VendorDeviceID26502426"
                    vendorAlarmId: "alarm_502426"
                    endpointId: "0efc9e22-67e3-415b-b9a4-26b3b71c3667"
                    alarmTimestamp: 1787265681078
                    backupInstanceId: "instance_id502426"
                    backupJobId: "11674598680SNNY2426"
                    backupJobName: "Test_Backup_Name502436"
                    backupTimestamp: 1787265681078
                    createdAt: "2026-08-20T22:41:21.112Z"
                    updatedAt: "2026-08-20T23:15:00.000Z"
                    description: "Backup job failed on device FAKE-WIN_756784608"
                    family: "Backup"
                    name: "BACKUP"
                    severity: "Critical"
                    type: "Backup"
                    vendorDeviceName: "FAKE-WIN_756784608"
                    vendorDeviceType: "Desktop"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/publicError"
              example:
                code: "backupdashboard:error:bad-request"
                message: "invalid value \"Info\" for severity"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/publicError"
              example:
                code: "backupdashboard:error:unexpected"
                message: "unable to extract claims"
        "429":
          description: Too many requests
          content:
            text/plain; charset=utf-8:
              example: Too Many Requests
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/publicError"
              example:
                code: "backupdashboard:error:internal"
                message: "unable to execute api"

