          x-cw-id-mapping:
            entityType: endpoint
            context: private
        physicalTotalBytes:
          type: integer
          format: int64
          description: Total installed physical RAM in bytes.
        physicalInUseBytes:
          type: integer
          format: int64
          description: Physical RAM currently in use, in bytes.
        physicalAvailableBytes:
          type: integer
          format: int64
          description: Physical RAM available (not in use), in bytes.
