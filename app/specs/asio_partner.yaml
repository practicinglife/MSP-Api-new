    post:
      tags:
      - Security Dashboard Cases
      summary: Batch create case comments
      description: |
        Batch create comments on a case. Requires security.cases.write.
        Request body is a JSON array of 1 to 10 items; more than 10 returns HTTP 400 (batch too large) and persists nothing.
        Each element contains only comments text (no author field in the body). Author is resolved from the authenticated partner token.

        Comment text must be valid UTF-8, 1–10000 characters; NFKC-normalized before persist.
        TAB, LF, and CR are allowed; other C0 controls, DEL, and bidirectional overrides
        (U+202A–U+202E, U+2066–U+2069) are rejected. Paragraph and line-break HTML wrappers are unwrapped
        to plain text; other HTML tags are not accepted. Markdown is allowed.

        Response contract:
        - Full success: HTTP 201 with { "message": "Comment saved successfully" } only when every batch item has valid
          comment text and ticket sync succeeds end-to-end for the case.
        - Partial success: HTTP 200 with { "status": "partial_success", "successfulRecords", "failedRecords" } when at
          least one index is not end-to-end successful. Each failedRecords entry has index, errorCode (for example
          TICKETING_SYNC_FAILED, INVALID_COMMENT_ITEM), and errorMessage — no comment text is returned.
        - Full failure: HTTP 4xx/5xx with { "code", "message" }.

        Audit: Successful and failed requests are audited by the service; partners can view them on the
        Audit Trails page in ConnectWise Platform.
      operationId: createCaseComments
      security:
      - endpoints_list: [security.cases.write]
      parameters:
      - $ref: '#/components/parameters/caseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 10
              description: Batch of case comments. Maximum 10 items; larger batches return HTTP 400.
              items:
                $ref: '#/components/schemas/CaseCommentCreateRequest'
            examples:
              singleComment:
                summary: One comment in batch
                value:
                - comments: "Investigation in progress."
      responses:
        "200":
          description: Partial success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseCommentPartialSuccessResponse'
        "201":
          description: Full success - all comments saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseCommentCreateSuccessResponse'
              examples:
                success:
                  value:
                    message: "Comment saved successfully"
        "400":
          description: Bad Request — empty or invalid body, batch larger than 10, invalid comment text, or invalid case identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Unauthorized - Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Forbidden - insufficient permissions to access this resource
