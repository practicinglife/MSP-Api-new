          type: string
          description: Name of the domain to which the computer system belongs
        domainRole:
          type: integer
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          description: |-
            WMI `Win32_ComputerSystem.DomainRole` (Windows PowerShell DomainRole).

            | Value | Name | Description |
            | --- | --- | --- |
            | 0 | StandaloneWorkstation | Standalone Workstation |
            | 1 | MemberWorkstation | Member Workstation |
            | 2 | StandaloneServer | Standalone Server |
            | 3 | MemberServer | Member Server |
            | 4 | BackupDomainController | Backup Domain Controller |
            | 5 | PrimaryDomainController | Primary Domain Controller |
        chassis:
          type: string
          enum:
          - Desktop
          - Laptop
          - Server
          - RAID
          - Other
          - Unknown
          description: |-
            Chassis category of the endpoint, derived from the first `chassisTypes` SMBIOS code.

            | chassis | chassisTypes codes |
            | --- | --- |
            | Desktop | 3, 4, 5, 6, 7, 13, 15, 16 |
            | Laptop | 8, 9, 10, 11, 12, 14, 18, 21 |
            | Server | 17, 23, 24 |
            | RAID | 22 |
            | Other | 19, 20 |
            | Unknown | 1, 2; also unmapped codes or empty `chassisTypes` |
        hypervisorName:
          type: string
          description: Name of Hypervisor for endpoint
        timeZoneLocation:
          type: string
          description: System Time Zone Location
        systemType:
          type: string
          description: System type
        chassisTypes:
          type: array
          description: |-
            SMBIOS chassis type codes (integer). The first mapped code determines `chassis`.

            | chassisTypes | chassis |
            | --- | --- |
            | 1, 2 | Unknown |
            | 3, 4, 5, 6, 7, 13, 15, 16 | Desktop |
            | 8, 9, 10, 11, 12, 14, 18, 21 | Laptop |
            | 17, 23, 24 | Server |
            | 19, 20 | Other |
            | 22 | RAID |
          items:
            type: integer
