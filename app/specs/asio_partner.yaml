        **Authentication:** Send `Authorization: Bearer <access_token>` where the token is obtained from `POST /v1/token`.


        **Required OAuth2 scope(s):** `platform.policies.read`'
      security:
      - OAuth2:
        - platform.policies.read
      parameters:
      - $ref: '#/components/parameters/policyID'
      responses:
        '200':
          description: Retrieved policy successfully
          content:
