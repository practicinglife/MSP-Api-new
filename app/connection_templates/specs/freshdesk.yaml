# Starter definition for API Tools connection templates (common read endpoints).
openapi: 3.0.3
info:
  title: Freshdesk API v2
  version: starter
  description: 'Starter definition: tickets, contacts, companies and agents. Made
    for API Tools connection templates; re-import a fuller definition if the vendor
    publishes one.'
paths:
  /tickets:
    get:
      operationId: listTickets
      summary: List tickets
      parameters:
      - name: filter
        in: query
        required: false
        description: new_and_my_open, watching, spam or deleted
        schema:
          type: string
      - name: updated_since
        in: query
        required: false
        description: ISO date
        schema:
          type: string
      - name: company_id
        in: query
        required: false
        description: Company ID
        schema:
          type: integer
      - &id001
        name: page
        in: query
        required: false
        description: Page number
        schema:
          type: integer
      - &id002
        name: per_page
        in: query
        required: false
        description: Results per page
        schema:
          type: integer
      responses:
        '200':
          description: OK
  /tickets/{id}:
    get:
      operationId: getTicket
      summary: Get a ticket
      parameters:
      - name: id
        in: path
        required: true
        description: Ticket ID
        schema:
          type: integer
      - name: include
        in: query
        required: false
        description: conversations, requester, company, stats
        schema:
          type: string
      responses:
        '200':
          description: OK
  /contacts:
    get:
      operationId: listContacts
      summary: List contacts
      parameters:
      - name: email
        in: query
        required: false
        description: Email
        schema:
          type: string
      - name: company_id
        in: query
        required: false
        description: Company ID
        schema:
          type: integer
      - *id001
      - *id002
      responses:
        '200':
          description: OK
  /companies:
    get:
      operationId: listCompanies
      summary: List companies
      parameters: &id003
      - *id001
      - *id002
      responses:
        '200':
          description: OK
  /agents:
    get:
      operationId: listAgents
      summary: List agents
      parameters: *id003
      responses:
        '200':
          description: OK
