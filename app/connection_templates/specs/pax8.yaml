# Starter definition for API Tools connection templates (common read endpoints).
openapi: 3.0.3
info:
  title: Pax8 Partner API
  version: starter
  description: 'Starter definition: companies, products, subscriptions, orders and
    invoices. Made for API Tools connection templates; re-import a fuller definition
    if the vendor publishes one.'
paths:
  /companies:
    get:
      operationId: listCompanies
      summary: List companies
      parameters:
      - name: status
        in: query
        required: false
        description: Status
        schema:
          type: string
      - &id001
        name: page
        in: query
        required: false
        description: Page number
        schema:
          type: integer
      - &id002
        name: size
        in: query
        required: false
        description: Page size
        schema:
          type: integer
      responses:
        '200':
          description: OK
  /companies/{companyId}:
    get:
      operationId: getCompany
      summary: Get a company
      parameters:
      - name: companyId
        in: path
        required: true
        description: Company ID
        schema:
          type: string
      responses:
        '200':
          description: OK
  /products:
    get:
      operationId: listProducts
      summary: List products
      parameters:
      - name: vendorName
        in: query
        required: false
        description: Vendor
        schema:
          type: string
      - *id001
      - *id002
      responses:
        '200':
          description: OK
  /subscriptions:
    get:
      operationId: listSubscriptions
      summary: List subscriptions
      parameters:
      - name: companyId
        in: query
        required: false
        description: Company ID
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Status
        schema:
          type: string
      - *id001
      - *id002
      responses:
        '200':
          description: OK
  /orders:
    get:
      operationId: listOrders
      summary: List orders
      parameters:
      - name: companyId
        in: query
        required: false
        description: Company ID
        schema:
          type: string
      - *id001
      - *id002
      responses:
        '200':
          description: OK
  /invoices:
    get:
      operationId: listInvoices
      summary: List invoices
      parameters:
      - *id001
      - *id002
      responses:
        '200':
          description: OK
