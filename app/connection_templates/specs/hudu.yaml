# Starter definition for API Tools connection templates (common read endpoints).
openapi: 3.0.3
info:
  title: Hudu API
  version: starter
  description: 'Starter definition: companies, assets, articles, websites and asset
    layouts. Made for API Tools connection templates; re-import a fuller definition
    if the vendor publishes one.'
paths:
  /companies:
    get:
      operationId: listCompanies
      summary: List companies
      parameters:
      - name: name
        in: query
        required: false
        description: Name
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Page number
        schema:
          type: integer
      responses:
        '200':
          description: OK
  /companies/{id}:
    get:
      operationId: getCompany
      summary: Get a company
      parameters:
      - name: id
        in: path
        required: true
        description: Company ID
        schema:
          type: integer
      responses:
        '200':
          description: OK
  /assets:
    get:
      operationId: listAssets
      summary: List assets
      parameters:
      - name: company_id
        in: query
        required: false
        description: Company ID
        schema:
          type: integer
      - name: name
        in: query
        required: false
        description: Name
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Page number
        schema:
          type: integer
      responses:
        '200':
          description: OK
  /articles:
    get:
      operationId: listArticles
      summary: List knowledge base articles
      parameters:
      - name: company_id
        in: query
        required: false
        description: Company ID
        schema:
          type: integer
      - name: name
        in: query
        required: false
        description: Name
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Page number
        schema:
          type: integer
      responses:
        '200':
          description: OK
  /websites:
    get:
      operationId: listWebsites
      summary: List monitored websites
      parameters:
      - name: name
        in: query
        required: false
        description: Name
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Page number
        schema:
          type: integer
      responses:
        '200':
          description: OK
  /asset_layouts:
    get:
      operationId: listAssetLayouts
      summary: List asset layouts
      parameters:
      - name: page
        in: query
        required: false
        description: Page number
        schema:
          type: integer
      responses:
        '200':
          description: OK
