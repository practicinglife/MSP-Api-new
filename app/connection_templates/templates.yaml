- id: eset_msp
  name: ESET MSP Administrator
  category: msp
  aliases: [eset, ema, ema2, eset msp, msp administrator, eset licensing]
  description: Companies, licences, sites and billing in ESET MSP Administrator 2 (EMA 2).
  kind: openapi
  slug: eset_msp
  builtin: eset
  source: {file: ../specs/eset.json}
  base_url: "{api_url}"
  auth: {type: token_login, username: "{username}", password: "{password}", login_url: "{api_url}/api/Token/Get"}
  fields:
    - {key: api_url, label: API address, default: "https://mspapi.eset.com"}
    - {key: username, label: API user name, help: "EMA 2 → Users → an API user (create one with the API access option)"}
    - {key: password, label: Password, secret: true, docs: "https://help.eset.com/ema2/en-US/api.html"}
  # EMA 2 reads with POST: these only look things up or report
  read_only: ["POST /api/Company/Detail", "POST /api/Company/Children", "POST /api/Company/Descendants",
              "POST /api/Company/Users", "POST /api/Search/Companies", "POST /api/Search/Licenses", "POST /api/Search/Users",
              "POST /api/License/Detail", "POST /api/License/GetHistory", "POST /api/License/GetPossibleProductChanges",
              "POST /api/User/GetUserDetails", "POST /api/User/GetDirectAccessibleChildren",
              "POST /api/BillingReport/MyCompany", "POST /api/BillingReport/MyCompanySelectedCompaniesOnly",
              "POST /api/BillingReport/SingleManagedCompany", "POST /api/BillingReport/DivisionsUnderSelectedDistributor",
              "POST /api/UsageReport/AllCompanies/products", "POST /api/UsageReport/SelectedCompanies/products",
              "POST /api/UsageReport/Detailed/products", "POST /api/UsageReport/DetailedSelectedCompanies/products",
              "POST /api/UsageReport/AllCompanies/categories", "POST /api/UsageReport/SelectedCompanies/categories",
              "POST /api/UsageReport/Monthly/products", "POST /api/UsageReport/Monthly/categories",
              "POST /api/UsageReport/Daily/products", "POST /api/UsageReport/Daily/categories"]
  suggested: ["GET /api/User/Current", "POST /api/Company/Children", "POST /api/Search/Companies"]

