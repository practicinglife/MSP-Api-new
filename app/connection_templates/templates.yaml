# ── Databases & generic ───────────────────────────────────────────────────────────────────────────────────────
- id: postgresql
  name: PostgreSQL
  category: data
  description: Read-only tools to list tables, describe them and run SELECT queries.
  kind: sql
  source: {}
  dsn: "postgresql://{username}:{password}@{host}:{port}/{database}"
  fields:
    - {key: host, label: Host}
    - {key: port, label: Port, default: "5432"}
    - {key: database, label: Database}
    - {key: username, label: User name, help: "A read-only database user is safest"}
    - {key: password, label: Password, secret: true}

- id: sql_server
  name: SQL Server
  category: data
  description: Read-only tools for Microsoft SQL Server / Azure SQL (needs the optional ODBC driver).
  kind: sql
  source: {}
  dsn: "mssql://{username}:{password}@{host}:{port}/{database}?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
  fields:
    - {key: host, label: Host}
    - {key: port, label: Port, default: "1433"}
    - {key: database, label: Database}
    - {key: username, label: User name, help: "A read-only SQL login is safest"}
    - {key: password, label: Password, secret: true,
       docs: "https://learn.microsoft.com/sql/connect/odbc/download-odbc-driver-for-sql-server"}

- id: mysql
  name: MySQL / MariaDB
  category: data
  description: Read-only tools for MySQL or MariaDB (needs the optional driver).
  kind: sql
  source: {}
  dsn: "mysql://{username}:{password}@{host}:{port}/{database}"
  fields:
    - {key: host, label: Host}
    - {key: port, label: Port, default: "3306"}
    - {key: database, label: Database}
    - {key: username, label: User name, help: "A read-only user is safest"}
    - {key: password, label: Password, secret: true}

- id: mongodb
  name: MongoDB
  category: data
  description: Read-only find, count and aggregate tools.
  kind: mongodb
  source: {}
  dsn: "{connection_string}"
  fields:
    - {key: connection_string, label: Connection string, secret: true, placeholder: "mongodb+srv://user:pass@cluster.example.net/db",
       help: "Atlas → Connect → Drivers. A read-only user is safest."}

- id: any_openapi
  name: Any API with an OpenAPI / Swagger link
  category: data
  description: Paste the link to an OpenAPI or Swagger definition; the sign-in it needs is read from it.
  kind: openapi
  source: {url: "{definition_url}"}
  base_url: "{base_url}"
  auth: {type: detect}
  fields:
    - {key: definition_url, label: Definition URL, placeholder: "https://api.example.com/openapi.json"}
    - {key: base_url, label: Base URL, required: false, help: "Only if the definition doesn't say where the API lives"}

- id: mcp_server
  name: Another MCP server
  category: data
  description: Serve another MCP server's tools here, behind your sign-in, approvals and audit log.
  kind: mcp
  source: {}
  base_url: "{url}"
  auth: {type: bearer, token: "{token}"}
  fields:
    - {key: url, label: MCP server URL, placeholder: "https://mcp.example.com/mcp"}
    - {key: token, label: Bearer token, secret: true, required: false, help: "Leave empty if the server doesn't need one"}

