# Connection templates: well-known APIs, ready to connect with only your credentials.
#
# Each entry becomes a POST /api/connections body (app/services/connection_templates.py → build_body):
#   kind          connection kind (openapi, graphql, sql, mongodb, mcp, …)
#   source        {url: …} a public definition, {file: specs/…} a starter bundled here, or {} (introspection, sql …)
#   base_url      where calls go
#   auth          {type: …, <field>: "…"} — values are templates filled from `fields`, e.g. "{email}/token"
#   extra_headers fixed headers sent on every call (templates too; empty values are dropped)
#   dsn           connection string template (sql / mongodb); values are URL-encoded into it
#   fields        what the person types: key, label, secret, required (default true), default, help, docs, placeholder
#   suggested     operations pinned as their own MCP tools after saving: "METHOD /path"
#   auth: {type: detect} — no fixed sign-in: the definition says (auth_hint) and the UI asks for that.
# "{name}" anywhere is replaced by the value of field `name`. Spec URLs are checked with
# `python -m app.cli check-templates` (live); starters under specs/ are small, hand-written definitions with the common
# read endpoints — re-import a fuller definition later if the vendor publishes one.

#   aliases       extra search words (other product names)
#   slug          the connection's handle (default: from the name)
#   builtin       the MSP pack's built-in integration for this tool: with the pack on, the picker opens that instead
#   read_only     "METHOD /path" operations that only read although they aren't GET (e.g. ScreenConnect's POSTs)

# ── MSP / IT ──────────────────────────────────────────────────────────────────────────────────────────────────
- id: connectwise_psa
  name: ConnectWise PSA
  category: msp
  aliases: [manage, connectwise manage, cw psa, psa]
  description: Companies, contacts, tickets, configurations, agreements and time in ConnectWise PSA (Manage).
  kind: openapi
  slug: cw_psa
  builtin: connectwise_psa
  source: {file: ../specs/connectwise_psa.json}
  base_url: https://{site}/v4_6_release/apis/3.0
  auth: {type: basic, username: "{company_id}+{public_key}", password: "{private_key}"}
  extra_headers: {clientId: "{client_id}"}
  fields:
    - {key: site, label: PSA site, default: na.myconnectwise.net, help: "na.myconnectwise.net, eu.myconnectwise.net, au.myconnectwise.net, or your own server"}
    - {key: company_id, label: Company ID, help: "The company you sign in to PSA with"}
    - {key: public_key, label: Public key, help: "System → Members → API Members → your API member → API Keys → Add"}
    - {key: private_key, label: Private key, secret: true}
    - {key: client_id, label: Client ID, help: "Register once at developer.connectwise.com → Client ID",
       docs: "https://developer.connectwise.com/ClientID"}
  suggested: ["GET /company/companies", "GET /service/tickets", "GET /company/configurations"]

- id: connectwise_asio
  name: ConnectWise Asio
  category: msp
  aliases: [platform, connectwise platform, asio platform, rmm, connectwise rmm]
  description: Companies, sites, endpoints (devices), agents and tickets on the ConnectWise Asio platform.
  kind: openapi
  slug: cw_asio
  builtin: asio
  source: {file: ../specs/asio_partner.yaml}
  base_url: "{api_url}"
  auth: {type: oauth2_client_credentials, client_id: "{client_id}", client_secret: "{client_secret}",
         token_url: "{api_url}/v1/token", client_auth: json,
         scope: "platform.companies.read platform.sites.read platform.devices.read platform.agent.read platform.asset.read platform.tickets.read"}
  fields:
    - {key: api_url, label: Platform address, default: "https://openapi.service.itsupport247.net",
       help: "North America: openapi.service.itsupport247.net · EU: https://openapi.service.euplatform.connectwise.com · AU: https://openapi.service.auplatform.connectwise.com"}
    - {key: client_id, label: Client ID, help: "Asio → Settings → API Clients (Integrations) → Add, with the read scopes you need"}
    - {key: client_secret, label: Client secret, secret: true, docs: "https://developer.connectwise.com/Products/ConnectWise_Asio"}
  suggested: ["GET /api/platform/v1/company/companies", "GET /api/platform/v1/company/sites",
              "GET /api/platform/v2/device/endpoints/search", "GET /api/platform/v2/service/ticketing/tickets"]

