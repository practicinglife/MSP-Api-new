       help: "Leave as is unless your RESTful API Manager extension has a different ID"}
  read_only: ["POST /GetSessionsByFilter", "POST /GetSessionsByName", "POST /GetSessionBySessionID",
              "POST /GetSessionDetailsBySessionID"]
  suggested: ["POST /GetSessionsByFilter", "POST /GetSessionDetailsBySessionID"]

