name: standardize-client
title: "Standardize {{client}} everywhere"
description: >
  Push the client's approved standard name to PSA, SentinelOne and every ScreenConnect session (client naming standard),
  inactivate duplicate PSA configurations, then fill any missing PSA Endpoint IDs from Asio (device naming standard).
  One change, approved once.
params:
  client: {type: string, description: Client id or client code}
steps:
  - command: apply_standard_name
    params: {client: "{{client}}"}
    optional: true
  - command: psa_inactivate_duplicates
    params: {client: "{{client}}"}
    optional: true
  - command: fix_psa_endpoint_ids
    params: {client: "{{client}}"}
    optional: true
