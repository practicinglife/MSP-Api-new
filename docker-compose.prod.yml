# ─── Production overrides — used on the Linux server ───
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from dev:
#   • app: removes the ./app:/app/app bind-mount (uses image code)
#   • postgres: persistent named volume so data survives restarts
#   • postgres: NOT exposed on host port (only reachable via the Docker network)
#   • ngrok: scaled to 0 by default (set NGROK_AUTHTOKEN + remove the deploy
#     block to re-enable, or run a real reverse proxy like nginx/caddy)

services:
  app:
    volumes: []
    restart: always
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  postgres:
    ports: []                          # don't expose 5432 to the host
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  ngrok:
    profiles: ["tunnel"]               # only starts when --profile tunnel is set
    restart: "no"

volumes:
  pgdata:

